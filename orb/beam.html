<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
  <title>Astra's ether</title>
  <style>
    /* Her beam layer: ether flowing from the orb to her panels and the app she's working in. Clicks pass through. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #beam { position: fixed; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; mix-blend-mode: screen; }
  </style>
</head>
<body>
  <svg id="beam" aria-hidden="true"></svg>
  <script src="beam.js"></script>
</body>
</html>
