<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>Astra</title>
  <link rel="stylesheet" href="orb.css">
</head>
<body>
  <main>
    <div class="orb-wrap">
      <canvas id="orb" width="320" height="260" aria-hidden="true" title="Drag to move"></canvas>
      <button id="talk" type="button" aria-label="Talk to Astra" title="Click to talk"></button>
      <button id="stop" type="button" aria-label="Stop Astra" title="Stop (Esc)" disabled>
        <!-- The "house" hieroglyph (O1): a square with an opening, so it still reads as stop. -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 19H5V5h14v14h-5"/><rect class="core" x="9" y="9" width="6" height="6" rx="0.5"/></svg>
      </button>
      <button id="minimise" type="button" aria-label="Minimise Astra (reopen from the menu bar)" title="Minimise · reopen from the menu bar">
        <!-- The "water" hieroglyph (N35): a ripple line, so it still reads as minimise. -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12.5l2.4-2.6 2.4 2.6 2.4-2.6 2.4 2.6 2.4-2.6 2.4 2.6 2.4-2.6 2.4 2.6"/></svg>
      </button>
    </div>
    <p id="state" class="state" aria-live="polite">Idle</p>

    <section id="card" class="card" hidden>
      <p id="caption-label" class="label">Transmission</p>
      <p id="caption" class="caption" aria-hidden="true"></p>
      <p id="caption-spoken" class="visually-hidden" aria-live="polite"></p>
      <p id="status" class="status"></p>
    </section>

    <section id="ask" class="card ask" role="alertdialog" aria-labelledby="ask-q" aria-describedby="ask-d" hidden>
      <p class="label">Authorisation required</p>
      <h2 id="ask-q"></h2>
      <pre id="ask-d"></pre>
      <div class="buttons">
        <button type="button" data-answer="no" aria-keyshortcuts="N">No</button>
        <button type="button" data-answer="always" aria-keyshortcuts="A">Always</button>
        <button type="button" data-answer="yes" class="primary" aria-keyshortcuts="Y">Yes</button>
      </div>
      <p class="hint">or say it: click the orb, then “yes”, “always” or “no”</p>
    </section>
  </main>
  <script src="orb.js"></script>
</body>
</html>
