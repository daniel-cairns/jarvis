<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
  <title>Astra is controlling your Mac</title>
  <style>
    /* Shown over the whole screen while Astra operates apps: a glowing edge and a label. Clicks pass through. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    .edge { position: fixed; inset: 0; border: 3px solid rgba(255, 176, 64, 0.9); box-shadow: inset 0 0 28px rgba(255, 150, 40, 0.55); animation: pulse 1.6s ease-in-out infinite; }
    .label { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(20, 14, 6, 0.86); color: #ffd28a; font: 600 12.5px/1.2 -apple-system, sans-serif; letter-spacing: 0.02em; box-shadow: 0 0 0 1px rgba(255, 176, 64, 0.6); }
    @keyframes pulse { 50% { border-color: rgba(255, 176, 64, 0.45); } }
    /* Her beam: a blue ray from the orb's core to the window she's working in, with pulses travelling along it. */
    #beam { position: fixed; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    #beam .glow { stroke: rgba(70, 150, 255, 0.5); stroke-width: 16; stroke-linecap: round; filter: blur(4px); }
    #beam .ray { stroke: #9ad6ff; stroke-width: 3.2; stroke-linecap: round; }
    #beam .pulse { stroke: #e8f6ff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 26; animation: travel 0.9s linear infinite; }
    #beam .frame { fill: rgba(70, 150, 255, 0.06); stroke: rgba(110, 185, 255, 0.85); stroke-width: 2; filter: drop-shadow(0 0 8px rgba(70, 150, 255, 0.7)); }
    #beam .hit { fill: #e8f6ff; filter: drop-shadow(0 0 6px rgba(120, 190, 255, 1)); }
    @keyframes travel { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .edge, #beam .pulse { animation: none; } }
  </style>
</head>
<body>
  <div class="edge" aria-hidden="true"></div>
  <svg id="beam" aria-hidden="true"></svg>
  <p class="label" role="status">Astra is controlling your Mac · say “stop” or press ⌃⌥⎋ to halt</p>
  <script src="beam.js"></script>
</body>
</html>
