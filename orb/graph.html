<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <!-- The graph library styles its tooltip inline, so this page allows inline styles (never inline script). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
  <title>Astra · Map</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="frame.css">
  <link rel="stylesheet" href="graph.css">
</head>
<body>
  <div class="slab">
    <div class="nub" aria-hidden="true"><svg viewBox="0 0 170 22" preserveAspectRatio="none"><polygon class="plate" points="0,22 170,22 170,10 156,0 0,0"/><polyline class="edge" points="0,0.8 156,0.8 169.5,10.5"/><polyline class="edge-inner" points="0,4 154,4 165,12"/></svg><p class="nub-label">Teardown map</p></div>
    <div class="rail" aria-hidden="true"><i></i><i></i><i></i><span class="gap"></span><i></i><i></i><i></i></div>
    <header id="bar" class="face" title="Drag to move">
      <span class="leds" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span>
      <svg class="face-icon" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="8"/><circle class="dot" cx="17" cy="17" r="2.2"/><path d="M3 17h5M26 17h5M17 3v4M17 27v4M7 7l3 3M24 24l3 3M27 7l-3 3M10 24l-3 3"/></svg>
      <div class="heading">
        <h1 id="title">Astra</h1>
        <p class="meta" aria-hidden="true">ASTRA-01 | CLASS: MAP | STATUS: ACTIVE</p>
      </div>
      <span class="vents" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <button id="close" type="button" aria-label="Close map (Esc)" title="Close (Esc)">×</button>
    </header>
    <div class="rail rail--bot" aria-hidden="true"></div>
    <div class="shelf" aria-hidden="true"></div>
    <main class="stage-wrap">
      <div id="graph" class="stage" role="img" aria-label="3D map of the teardown; the same map is listed as text below for screen readers"></div>
      <ul id="legend" class="legend" aria-label="Legend"></ul>
      <p class="hint" aria-hidden="true">Drag to orbit · scroll or + / − to zoom · click a node</p>
      <div class="zoom" role="group" aria-label="Zoom">
        <button id="zoom-in" type="button" aria-label="Zoom in (+)" title="Zoom in (+)">+</button>
        <button id="zoom-out" type="button" aria-label="Zoom out (−)" title="Zoom out (−)">−</button>
        <button id="zoom-fit" type="button" aria-label="Fit the whole map (0)" title="Fit (0)">⤢</button>
      </div>
      <aside id="info" class="info" hidden aria-live="polite">
        <button id="info-close" type="button" aria-label="Close node details">×</button>
        <p id="info-group" class="label"></p>
        <h2 id="info-title"></h2>
        <p id="info-detail"></p>
        <ul id="info-links"></ul>
      </aside>
      <ul id="outline" class="visually-hidden" aria-label="Map as a list"></ul>
    </main>
    <footer class="nub nub--foot"><svg viewBox="0 0 170 22" preserveAspectRatio="none" aria-hidden="true"><polygon class="plate" points="0,22 170,22 170,10 156,0 0,0"/><polyline class="edge" points="0,0.8 156,0.8 169.5,10.5"/><polyline class="edge-inner" points="0,4 154,4 165,12"/></svg><p class="nub-label"><span id="stamp"></span></p></footer>
  </div>
  <script src="build/graph.js"></script>
</body>
</html>
