<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'">
  <title>Astra · Tallyline</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="frame.css">
  <link rel="stylesheet" href="work.css">
  <link rel="stylesheet" href="glyph.css">
</head>
<body>
  <div class="slab">
    <div class="nub" aria-hidden="true"><svg viewBox="0 0 170 22" preserveAspectRatio="none"><polygon class="plate" points="0,22 170,22 170,10 156,0 0,0"/><polyline class="edge" points="0,0.8 156,0.8 169.5,10.5"/><polyline class="edge-inner" points="0,4 154,4 165,12"/></svg><p class="nub-label">Tallyline</p></div>
    <div class="rail" aria-hidden="true"><i></i><i></i><i></i><span class="gap"></span><i></i><i></i><i></i></div>
    <header id="bar" class="face" title="Drag to move">
      <span class="leds" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span>
      <svg class="face-icon" viewBox="0 0 34 34" aria-hidden="true"><path d="M7 26V12M13 26V8M19 26V15M25 26V10M5 27h24"/></svg>
      <div class="heading">
        <h1 id="title">Tallyline</h1>
        <button id="collapse" class="meta fold-line" type="button" aria-expanded="true" aria-controls="body" title="Collapse"><span class="visually-hidden">Tallyline summary: </span><span id="meta">LOADING</span></button>
      </div>
      <button id="expand" class="t-expand" type="button" aria-label="Open the full Tallyline app" title="Open the full app">⤢</button>
      <button id="close" type="button" aria-label="Close Tallyline (Esc)" title="Close (Esc)">×</button>
    </header>
    <div class="rail rail--bot" aria-hidden="true"></div>
    <div class="shelf" aria-hidden="true"></div>
    <main id="body" class="work-body tallyline" tabindex="-1" aria-label="Tallyline at a glance">
      <p class="empty">Checking Tallyline…</p>
    </main>
    <p id="announce" class="visually-hidden" role="status" aria-live="polite"></p>
    <footer class="nub nub--foot"><svg viewBox="0 0 170 22" preserveAspectRatio="none" aria-hidden="true"><polygon class="plate" points="0,22 170,22 170,10 156,0 0,0"/><polyline class="edge" points="0,0.8 156,0.8 169.5,10.5"/><polyline class="edge-inner" points="0,4 154,4 165,12"/></svg><p class="nub-label"><span id="stamp"></span></p></footer>
  </div>
  <script src="drag.js"></script>
  <script src="slab.js"></script>
  <script src="tallyline-view.js"></script>
  <script src="tallyline.js"></script>
</body>
</html>
