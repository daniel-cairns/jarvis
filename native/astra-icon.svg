<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Astra's app icon: the winged sun from her menu-bar icon, in the orb's navy, reactor teal and gold.
       Rendered to Astra.icns by scripts/make-app.sh. The tile follows macOS's 824 px grid with room for the shadow. -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1b2f66"/>
      <stop offset="0.6" stop-color="#0c1736"/>
      <stop offset="1" stop-color="#060b1e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#46e0d6" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#46e0d6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#46e0d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c4"/>
      <stop offset="0.45" stop-color="#f8dc95"/>
      <stop offset="1" stop-color="#d79e2e"/>
    </linearGradient>
    <radialGradient id="sun" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.5" stop-color="#ecbc52"/>
      <stop offset="1" stop-color="#b07a1c"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="wing">
      <path d="M 690 452 L 878 404 Q 892 401 888 414 Q 884 428 870 432 L 690 486 Z"/>
      <path d="M 694 518 L 846 480 Q 860 477 856 490 Q 852 504 838 508 L 694 550 Z"/>
      <path d="M 692 584 L 808 556 Q 822 553 818 566 Q 814 580 800 584 L 692 614 Z"/>
    </g>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#46e0d6" stroke-opacity="0.18" stroke-width="3"/>
  <circle cx="512" cy="512" r="330" fill="url(#glow)"/>

  <g fill="url(#gold)">
    <use href="#wing"/>
    <use href="#wing" transform="translate(1024 0) scale(-1 1)"/>
  </g>

  <circle cx="512" cy="512" r="150" fill="none" stroke="#46e0d6" stroke-width="24" filter="url(#bloom)" opacity="0.8"/>
  <circle cx="512" cy="512" r="150" fill="none" stroke="#7ff3ea" stroke-width="16"/>
  <circle cx="512" cy="512" r="104" fill="url(#sun)"/>
  <ellipse cx="482" cy="474" rx="40" ry="26" fill="#fff" opacity="0.28"/>
</svg>
